! Configuration File for keepalived

global_defs {
   router_id nginxbackup
   script_user root
   enable_script_security
}

# 检测 Nginx 是否存活
vrrp_script chk_nginx {
    script "/usr/bin/killall -0 nginx"
    interval 2
    weight -20
    fall 2
    rise 2
}

vrrp_instance VI_1 {
    state BACKUP
    interface ens160
    virtual_router_id 51
    priority 90
    advert_int 1

    authentication {
        auth_type PASS
        auth_pass 1111
    }

    virtual_ipaddress {
        192.168.189.100/24 dev ens160
    }

    track_script {
        chk_nginx
    }
}
