# 基础配置
port 6379
daemonize no
logfile "/var/log/redis/redis-master.log"
dir "/var/lib/redis/master"

bind 0.0.0.0
protected-mode yes
requirepass "yjk19308769931"
masterauth "yjk19308769931"
replicaof 192.168.189.137 6379
# 持久化（建议开启，避免主节点重启后数据为空导致从节点被清空）
appendonly yes

# Generated by CONFIG REWRITE
save 3600 1
save 300 100
save 60 10000

supervised systemd
latency-tracking-info-percentiles 50 99 99.9
user default on sanitize-payload #2ba2c2f6aa6708d9404bcd3c21a639e7e334a4d9d440003f54470fdc27b6fdba ~* &* +@all

